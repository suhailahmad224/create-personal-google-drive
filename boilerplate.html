<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Drive</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        /* NAVBAR */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
        }

        .search-box {
            display: flex;
            width: 420px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;

            border: 1px solid #d1d5db;
            border-radius: 10px 0 0 10px;

            outline: none;
            font-size: 15px;
        }

        .search-box button {
            padding: 12px 18px;

            border: none;
            background: #2563eb;
            color: white;

            border-radius: 0 10px 10px 0;

            cursor: pointer;
        }

        /* LAYOUT */

        .layout {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        /* SIDEBAR */

        .sidebar {
            width: 230px;
            background: white;
            border-right: 1px solid #e5e7eb;

            padding: 25px 15px;
        }

        .sidebar a {
            display: block;

            padding: 13px 16px;

            margin-bottom: 8px;

            text-decoration: none;
            color: #374151;

            border-radius: 10px;

            font-size: 15px;
        }

        .sidebar a:hover {
            background: #eff6ff;
            color: #2563eb;
        }

        /* MAIN */

        .main {
            flex: 1;
            padding: 30px;
            max-width: 1400px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 28px;
        }

        /* ACTION BUTTONS */

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 25px;
        }

        .btn {
            border: none;

            padding: 11px 18px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 600;
        }

        .upload-btn {
            background: #2563eb;
            color: white;

            display: inline-block;
        }

        .upload-btn:hover {
            background: #1d4ed8;
        }

        .folder-btn {
            background: #e0ecff;
            color: #2563eb;
        }

        .folder-btn:hover {
            background: #d4e4ff;
        }

        .file-input {
            display: none;
        }

        /* FOLDER FORM */

        .folder-form {
            display: flex;
            gap: 8px;
        }

        .folder-form input {
            padding: 10px 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            font-size: 14px;
        }

        /* NAVIGATION */

        .navigation {
            margin-bottom: 20px;
        }

        .navigation a {
            display: inline-block;

            text-decoration: none;

            background: white;

            border: 1px solid #e5e7eb;

            padding: 9px 14px;

            border-radius: 8px;

            color: #374151;

            margin-right: 8px;
        }

        .navigation a:hover {
            background: #f3f4f6;
        }

        /* FILE CONTAINER */

        .file-container {
            background: white;

            border-radius: 14px;

            border: 1px solid #e5e7eb;

            overflow: hidden;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        /* FILE HEADER */

       .file-header{
    display:grid;
    grid-template-columns:minmax(300px,1fr) 100px 550px;
    padding:15px 20px;
    background:#f9fafb;
    border-bottom:1px solid #e5e7eb;
    color:#6b7280;
    font-size:13px;
    font-weight:bold;
}

        /* FILE ROW */

        .file-row{
    display:grid;
    grid-template-columns:minmax(300px,1fr) 100px 550px;
    align-items:center;
    padding:17px 20px;
    border-bottom:1px solid #f0f0f0;
    transition:0.2s;
}
        /* FILE NAME */

       .file-name{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
        /* ACTIONS */

        .actions-area {
            display: flex;

            gap: 7px;

            align-items: center;

            flex-wrap: wrap;
        }

        .action {
            text-decoration: none;

            padding: 7px 10px;

            border-radius: 7px;

            font-size: 12px;

            background: #f3f4f6;

            color: #374151;
        }

        .action:hover {
            background: #e5e7eb;
        }

        .delete {
            color: #dc2626;
        }

        /* RENAME */

        .rename-form {
            display: flex;

            gap: 5px;
        }

        .rename-form input {
            width: 120px;

            padding: 7px 9px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            outline: none;
        }

        .rename-form button {
            border: none;

            padding: 7px 10px;

            background: #eef2ff;

            color: #4338ca;

            border-radius: 7px;

            cursor: pointer;
        }

        .rename-form button:hover {
            background: #e0e7ff;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .sidebar {
                display: none;
            }

            .navbar {
                padding: 0 15px;
            }

            .logo {
                font-size: 20px;
            }

            .search-box {
                width: 55%;
            }

            .main {
                padding: 15px;
            }

            .file-header {
                display: none;
            }

            .file-row {
                display: block;
            }

            .actions-area {
                margin-top: 12px;
            }
        }
    </style>
</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ☁️ My Drive
        </div>


        <form
            action="/search"
            method="GET"
            class="search-box"
        >

            <input
                type="text"
                name="q"
                placeholder="Search files and folders..."
                required
            >

            <button type="submit">
                🔍
            </button>

        </form>

    </nav>


    <!-- LAYOUT -->

    <div class="layout">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <a href="/">
                🏠 Home
            </a>

            <a href="/">
                📁 My Files
            </a>

        </aside>


        <!-- MAIN -->

        <main class="main">


            <div class="heading">

                <h1>
                    My Files
                </h1>

            </div>


            <!-- ACTIONS -->

            <div class="actions">


                <!-- UPLOAD -->

                <form
                    action="${uploadPath}"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <label class="btn upload-btn">

                        ⬆️ Upload File

                        <input
                            class="file-input"
                            type="file"
                            name="file"
                            onchange="this.form.submit()"
                        >

                    </label>

                </form>


                <!-- NEW FOLDER -->

                <form
                    action="/create-folder"
                    method="POST"
                    class="folder-form"
                >

                    <input
                        type="text"
                        name="folderName"
                        placeholder="Folder name"
                        required
                    >

                    <input
                        type="hidden"
                        name="path"
                        value="${url}"
                    >

                    <button
                        class="btn folder-btn"
                        type="submit"
                    >
                        📁 New Folder
                    </button>

                </form>

            </div>


            <!-- NAVIGATION -->

            <div class="navigation">

                ${navigation}

            </div>


            <!-- FILE LIST -->

            <div class="file-container">


                <div class="file-header">

                    <div>
                        NAME
                    </div>

                    <div>
                        TYPE
                    </div>

                    <div>
                        ACTIONS
                    </div>

                </div>


                ${dynamicHTML}


            </div>


        </main>

    </div>

</body>

</html>
